<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LRCLIB • Word Sync Publisher</title><style>:root{font-family:system-ui;color-scheme:dark;background:#101115;color:#eee}body{max-width:740px;margin:auto;padding:24px 16px}h1{font-size:26px}p,small{color:#aeb2be}label{display:block;margin:14px 0 5px;font-weight:600}input,textarea,button{box-sizing:border-box;width:100%;background:#1e2027;color:white;border:1px solid #40434d;border-radius:10px;padding:12px;font:inherit}textarea{height:210px;font:12px monospace}button{background:#7366f0;border:0;font-weight:700;margin-top:12px}button:disabled{opacity:.45}pre{white-space:pre-wrap;word-break:break-word;background:#1c1e25;padding:14px;border-radius:10px;max-height:250px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{margin:0}#status{color:#c5c7fa}.note{background:#1e2027;padding:12px;border-radius:10px}</style><h1>LRCLIB Publisher</h1><p>Enhanced LRC → Lyricsfile YAML → publicação Word Sync. Nada é enviado até você confirmar.</p><label>Importar arquivo .lrc ou .lyricsfile.yaml</label><input type="file" id="file" accept=".lrc,.yaml,.yml,.txt"><label>Ou cole seu Enhanced LRC</label><textarea id="source" placeholder="[ti:Nome]\n[ar:Artista]\n[00:10.00]<00:10.00>Uma <00:10.50>palavra"></textarea><div class="grid"><label>Título<input id="title"></label><label>Artista<input id="artist"></label><label>Álbum<input id="album"></label><label>Duração (mm:ss)<input id="duration" placeholder="04:15"></label></div><button id="convert">Converter e validar</button><label>Prévia do Lyricsfile YAML</label><textarea id="output" style="height:240px" placeholder="A conversão aparecerá aqui; também pode colar Lyricsfile YAML válido diretamente."></textarea><button id="save">Salvar YAML</button><p class="note">O desafio de publicação expira em 5 minutos. No celular, a resolução pode ser lenta. Use HTTPS para permitir criptografia do navegador. O botão abaixo publica uma nova revisão pública.</p><button id="cancel" type="button" disabled style="background:#424657">Cancelar desafio</button><button id="publish">Publicar no LRCLIB</button><p id="status" role="status"></p><pre id="log"></pre><script>
const $=id=>document.getElementById(id);let plain='',synced='';const esc=s=>JSON.stringify(String(s));function ms(t){let a=t.split(':');return Math.round((Number(a[0])*60+Number(a[1]))*1000)}function stamp(n){let m=Math.floor(n/60000),s=(n%60000)/1000;return `[${String(m).padStart(2,'0')}:${s.toFixed(2).padStart(5,'0')}]`};function parseLRC(src){let tags={};let lines=[];for(const raw of src.split(/\r?\n/)){let m=raw.match(/^\[(ti|ar|al|length):([^\]]*)\]/i);if(m){tags[m[1].toLowerCase()]=m[2].trim();continue}m=raw.match(/^\[(\d{2,}:\d{2}(?:\.\d{1,3})?)\](.*)$/);if(!m)continue;let start=ms(m[1]),body=m[2],re=/<(\d{2,}:\d{2}(?:\.\d{1,3})?)>/g,marks=[...body.matchAll(re)];if(!body.trim()){lines.push({text:'',start_ms:start});continue}let words=[];for(let i=0;i<marks.length;i++){let begin=marks[i].index+marks[i][0].length,end=i+1<marks.length?marks[i+1].index:body.length;let text=body.slice(begin,end);if(text)words.push({text,start_ms:ms(marks[i][1])})}let text=marks.length?words.map(w=>w.text).join(''):body;lines.push({text,start_ms:start,words})}if(!lines.length)throw Error('Nenhuma linha LRC encontrada.');lines.sort((a,b)=>a.start_ms-b.start_ms);return {tags,lines}}
function yamlDoc(lines,title,artist,album,duration){let out=`version: '1.0'\nmetadata:\n  title: ${esc(title)}\n  artist: ${esc(artist)}\n  album: ${esc(album)}\n  duration_ms: ${duration}\nlines:\n`;let texts=[];for(let i=0;i<lines.length;i++){let l=lines[i],next=lines[i+1]?.start_ms??duration;let end=Math.max(l.start_ms+1,Math.min(duration,next));out+=`  - text: ${esc(l.text)}\n    start_ms: ${l.start_ms}\n    end_ms: ${end}\n`;if(l.words?.length){out+='    words:\n';for(let j=0;j<l.words.length;j++){let w=l.words[j],wend=j+1<l.words.length?l.words[j+1].start_ms:end;out+=`      - text: ${esc(w.text)}\n        start_ms: ${w.start_ms}\n        end_ms: ${Math.max(w.start_ms+1,wend)}\n`}}if(l.text.trim())texts.push(l.text)}out+='plain: |\n'+texts.map(t=>'  '+t).join('\n')+'\n';return out}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();if(/\.ya?ml$/i.test(f.name)){$('output').value=t;$('status').textContent='YAML carregado: confira os metadados antes de publicar.'}else{$('source').value=t;$('convert').click()}};
$('convert').onclick=()=>{try{let {tags,lines}=parseLRC($('source').value);$('title').value=$('title').value||tags.ti||'';$('artist').value=$('artist').value||tags.ar||'';$('album').value=$('album').value||tags.al||'';$('duration').value=$('duration').value||tags.length||'';let dur=ms($('duration').value);if(!Number.isFinite(dur)||dur<=0)throw Error('Duração inválida.');if(lines.some(l=>l.start_ms>dur))throw Error('Há timestamps depois da duração da faixa.');$('output').value=yamlDoc(lines,$('title').value,$('artist').value,$('album').value,dur);plain=lines.filter(l=>l.text).map(l=>l.text).join('\n');synced=lines.map(l=>stamp(l.start_ms)+l.text).join('\n');let wc=lines.reduce((n,l)=>n+(l.words?.length||0),0);$('status').textContent=`Convertido: ${lines.length} linhas, ${wc} segmentos sincronizados. Revise o YAML.`;$('log').textContent='';}catch(e){$('status').textContent='Erro: '+e.message}};
$('save').onclick=()=>{if(!$('output').value.trim())return alert('Converta primeiro.');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('output').value],{type:'text/yaml'}));a.download=($('title').value||'letra').replace(/[^\w-]+/g,'_')+'.lyricsfile.yaml';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function post(path,body,headers={}){let r=await fetch('https://lrclib.net/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','Lrclib-Client':'WordSyncPublisher/1.0 (local browser app)',...headers},body:JSON.stringify(body)});let t=await r.text();if(!r.ok)throw Error(`HTTP ${r.status}: ${t.slice(0,450)}${r.status===429?' — Aguarde o Retry-After antes de tentar novamente.':''}`);try{return JSON.parse(t)}catch{return t}}
let challengeWorker=null;
$('cancel').onclick=()=>{if(challengeWorker){challengeWorker.terminate();challengeWorker=null;$('status').textContent='Desafio cancelado.';$('cancel').disabled=true;$('publish').disabled=false}};
async function solve(prefix,target){
 if(!crypto?.subtle)throw Error('Criptografia indisponível. Abra o site via HTTPS.');
 const workerSource = `onmessage=async e=>{const {prefix,target}=e.data;try{let limit=BigInt('0x'+target),enc=new TextEncoder(),start=Date.now();for(let n=0;Date.now()-start<240000;n++){let digest=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(prefix+n)));let hex=Array.from(digest,x=>x.toString(16).padStart(2,'0')).join('');if(BigInt('0x'+hex)<=limit){postMessage({found:String(n)});return}if(n%5000===0)postMessage({attempts:n,elapsed:Math.floor((Date.now()-start)/1000)})}postMessage({error:'Desafio expirou antes de encontrar uma solução.'})}catch(err){postMessage({error:String(err.message||err)})}}`;
 return await new Promise((resolve,reject)=>{
 const url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));
 const worker=new Worker(url);URL.revokeObjectURL(url);challengeWorker=worker;$('cancel').disabled=false;
 worker.onmessage=e=>{let d=e.data;if(d.found!==undefined||d.error){worker.terminate();challengeWorker=null;$('cancel').disabled=true;d.error?reject(Error(d.error)):resolve(d.found)}else{$('status').textContent=`Desafio: ${d.attempts.toLocaleString('pt-BR')} tentativas • ${Math.round(d.attempts/Math.max(d.elapsed,1)).toLocaleString('pt-BR')}/s • ${d.elapsed}s / 240s`}};
 worker.onerror=e=>{worker.terminate();challengeWorker=null;$('cancel').disabled=true;reject(Error(e.message))};
 worker.postMessage({prefix,target});
 });
}
$('publish').onclick=async()=>{let b=$('publish');try{let title=$('title').value.trim(),artist=$('artist').value.trim(),album=$('album').value.trim(),duration=ms($('duration').value),lyricsfile=$('output').value.trim();if(!title||!artist||!album||!duration||!lyricsfile)throw Error('Preencha todos os metadados e gere o YAML.');if(!/^version:\s*['"]?1\.0/m.test(lyricsfile)||!/^lines:/m.test(lyricsfile))throw Error('Lyricsfile YAML não reconhecido.');if(!confirm(`PUBLICAR uma nova revisão pública de "${title}" — ${artist} no LRCLIB? Confira antes os timestamps.`))return;b.disabled=true;$('status').textContent='Solicitando desafio…';let ch=await post('request-challenge',{});if(!ch.prefix||!ch.target)throw Error('Resposta do desafio inválida.');let nonce=await solve(ch.prefix,ch.target);$('status').textContent='Enviando letra…';let result=await post('publish',{trackName:title,artistName:artist,albumName:album,duration:duration/1000,lyricsfile},{'X-Publish-Token':ch.prefix+':'+nonce});$('status').textContent='Publicação aceita pelo servidor!';$('log').textContent=JSON.stringify(result,null,2)}catch(e){$('status').textContent='Falha: '+e.message;$('log').textContent='Nenhuma confirmação de publicação.'}finally{b.disabled=false}};
</script></html>
